<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - TechCart</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .auth-container { max-width: 400px; margin: 4rem auto; }
    .error-msg { color: #dc3545; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="logo">TechCart</a>
</nav>

<div class="container auth-container fade-in">
  <div class="card">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Crear Cuenta</h2>
    <form id="registroForm">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="rol">¿Cómo usarás TechCart?</label>
        <select id="rol" class="form-control" required>
          <option value="cliente">Quiero comprar (Cliente)</option>
          <option value="vendedor">Quiero vender (Vendedor)</option>
        </select>
      </div>
      <div id="registroError" class="error-msg"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btnRegistro">Registrarse</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>
</div>

<script type="module" src="../js/global.js"></script>
<!-- Usamos type="module" porque estamos importando supabase -->
<script type="module" src="registro.js"></script>
</body>
</html>
